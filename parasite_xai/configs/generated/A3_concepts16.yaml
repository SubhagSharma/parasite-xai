seed: 1337
device: cuda
data:
  name: chula_parasite_egg_11
  root: ../data/chula_tiny
  img_size: 224
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  boxes_dir: null
backbone:
  name: mobilevit_xs
  pretrained: true
model:
  kind: cbm
  num_classes: 11
  protopnet:
    num_prototypes_per_class: 5
    proto_dim: 128
    pip_sparsity: true
  cbm:
    num_concepts: 16
    bottleneck: true
    concept_source: labels
train:
  epochs: 1
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 3
  proto_push_every: 10
  amp: true
explain:
  posthoc:
  - gradcam
  - hirescam
  - integrated_gradients
  - lime
  - kernelshap
  amortized:
    enabled: true
    teacher_ckpt: null
    train_epochs: 30
eval:
  faithfulness:
  - deletion
  - insertion
  - infidelity
  - sensitivity
  - sanity_check
  localisation:
  - pointing_game
  - energy_pointing_game
  - iou
  cost:
  - params
  - flops
  - latency_cpu
  - model_size_mb
  quantize_int8: false
trust:
  calibration: temperature
  conformal: true
  alpha: 0.1
output_dir: ./runs/A3_concepts16
